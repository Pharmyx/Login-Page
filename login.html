<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Konner Round">
    <meta name="description" content="KONNECT Login Page">
    <meta name="keywords" content="Robots, AI, Future, Space, Technology, KONNECT, Konnect, konnect">
    <title>Login Page</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <form action="#" method="POST">
        <div class="container">
            <div class="login_box">
                <h2>Login Page</h2>
                
                <label for="email">Email</label>
                <input type="email" id="email" name="email-input" placeholder="Email" required>

                <label for="name">Your Name</label>
                <input type="text" id="name" name="name-input" placeholder="Your Name" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password-input" placeholder="Password" required>

                <button type="submit">Login</button>

                <p><a href="signup.html">Already have an account?</a></p>
            </div>
        </div>
    </form>

    <script src="index.js"></script>
</body>
</html>
